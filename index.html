<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒バトフレームクイズ</title>
<style>
  :root{
    --bg:#0f1115; --panel:#191c22; --panel2:#22262e; --line:#2e333d;
    --text:#e8eaed; --muted:#9aa0aa; --accent:#4aa3ff;
    --ok:#2ecc71; --ng:#e74c3c; --gold:#f1c40f;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; line-height:1.5;}
  .wrap{max-width:720px; margin:0 auto; padding:16px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
  h1{font-size:1.2rem; margin:0; cursor:pointer;}
  .hud{font-size:.85rem; color:var(--muted); text-align:right; white-space:nowrap;}
  .hud b{color:var(--text);} .hud .time{color:var(--gold); font-variant-numeric:tabular-nums;}

  button{font:inherit; color:var(--text); background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer; transition:.12s;}
  button:hover:not(:disabled){border-color:var(--accent);}
  button:disabled{opacity:.4; cursor:default;}

  /* ホーム */
  .modes{display:grid; gap:12px; margin-top:8px;}
  .mode-card{text-align:left; padding:16px; border-radius:12px; background:var(--panel); border:1px solid var(--line);}
  .mode-card:hover{border-color:var(--accent);}
  .mode-card .t{font-size:1.1rem; font-weight:700;}
  .mode-card .d{font-size:.85rem; color:var(--muted); margin-top:4px;}
  .mode-card .emoji{font-size:1.3rem; margin-right:6px;}

  /* フレーム */
  .frame-box{position:relative; background:#000; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;}
  .frame-box img{width:100%; height:100%; object-fit:contain; display:block;}
  .frame-tag{position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:6px; font-size:.75rem; color:var(--muted);}
  .controls{display:flex; gap:8px; margin:10px 0 4px;}
  .btn-alt{flex:1;}
  .hint{font-size:.8rem; color:var(--muted); margin:2px 0 12px;}

  .q{font-size:.95rem; color:var(--muted); margin:6px 0;}
  .choices{display:grid; gap:10px;}
  .choice{text-align:left; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); width:100%;}
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice .title{font-weight:600; font-size:1rem;}
  .choice .author{font-size:1.05rem; font-weight:700; color:var(--accent); margin-top:3px;}
  .choice .date{font-size:.8rem; color:var(--muted); margin-top:1px;}
  .choice .meta{font-size:.82rem; color:var(--muted); margin-top:2px;}

  /* 作者選択 */
  .search{width:100%; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); margin:8px 0;}
  .author-list{display:grid; gap:8px; max-height:56vh; overflow:auto; padding-right:4px;}
  .author-item{display:flex; justify-content:space-between; align-items:center; text-align:left;
    padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line);}
  .author-item:hover{border-color:var(--accent);}
  .author-item .n{color:var(--muted); font-size:.85rem; white-space:nowrap;}
  .back{background:transparent; border:none; color:var(--muted); padding:6px 0; cursor:pointer;}
  .back:hover{color:var(--accent);}
  .choice.correct{border-color:var(--ok); background:rgba(46,204,113,.12);}
  .choice.wrong{border-color:var(--ng); background:rgba(231,76,60,.12);}

  .result{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); display:none;}
  .result.show{display:block;}
  .result a{color:var(--accent);}
  .next{margin-top:12px; width:100%; background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:700;}
  .loading{color:var(--muted); text-align:center; padding:40px 0;}

  /* 結果画面 */
  .final{text-align:center; padding:20px 0;}
  .final .big{font-size:2.6rem; font-weight:800; color:var(--gold);}
  .final .sub{color:var(--muted); margin-top:4px;}
  .name-row{display:flex; gap:8px; margin:16px 0;}
  .name-row input{flex:1; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text);}

  /* ランキング */
  table.rank{width:100%; border-collapse:collapse; margin-top:8px; font-size:.9rem;}
  table.rank th,table.rank td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
  table.rank th{color:var(--muted); font-weight:600; font-size:.8rem;}
  table.rank td.r{width:36px; color:var(--muted); font-variant-numeric:tabular-nums;}
  table.rank td.sc{text-align:right; font-weight:700; font-variant-numeric:tabular-nums;}
  table.rank tr.me{background:rgba(74,163,255,.12);}
  .tabs{display:flex; gap:8px; margin-top:8px;}
  .tabs button{flex:1; font-size:.85rem;}
  .tabs button.active{border-color:var(--accent); color:var(--accent);}

  footer{margin-top:20px; font-size:.75rem; color:var(--muted); text-align:center;}
  footer a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 onclick="home()">🥢 棒バトフレームクイズ</h1>
    <div class="hud" id="hud"></div>
  </header>
  <div id="app"><div class="loading">読み込み中…</div></div>
  <footer>データ元: <a href="https://aiueo9999.pythonanywhere.com/" target="_blank" rel="noopener">棒バトLOD</a></footer>
</div>

<script>
// ===== Supabase 設定 =====
const SB_URL = "https://cwhribtvhiqvqgknaecj.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3aHJpYnR2aGlxdnFna25hZWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDI2MjcsImV4cCI6MjEwNTYxODYyN30.NnnvQ2XRa8HkQ80McmdXozLfTYHpysRTxbgziyuO67Q";

const TA_SECONDS = 60;   // タイムアタックの制限時間
const ACC_TOTAL = 50;    // 正答率モードの問題数

const S = { works:[], cur:null, frameIdx:0, answered:false, mode:null };

function pick(arr,n){const a=arr.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o;}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const app = ()=>document.getElementById('app');
const hud = ()=>document.getElementById('hud');

async function load(){
  try{
    const all = await (await fetch('quiz_data.json',{cache:'no-store'})).json();
    S.works = all.filter(w=>w.frames && w.frames.length);
    if(S.works.length<4){app().innerHTML='<div class="loading">データが足りません</div>';return;}
    home();
  }catch(e){ app().innerHTML='<div class="loading">quiz_data.json を読み込めませんでした</div>'; }
}

// ===== ホーム =====
function home(){
  S.mode=null; hud().textContent='';
  app().innerHTML = `
    <div class="modes">
      <button class="mode-card" onclick="startNormal()">
        <div class="t"><span class="emoji">♾️</span>ふつうモード</div>
        <div class="d">気軽にエンドレスで挑戦。連続正解数を伸ばそう。</div>
      </button>
      <button class="mode-card" onclick="startTA()">
        <div class="t"><span class="emoji">⏱️</span>タイムアタック（${TA_SECONDS}秒）</div>
        <div class="d">制限時間内に何問正解できるか。ランキングあり🏆</div>
      </button>
      <button class="mode-card" onclick="startACC()">
        <div class="t"><span class="emoji">🎯</span>正答率モード（${ACC_TOTAL}問）</div>
        <div class="d">${ACC_TOTAL}問の正解数と早さを競う。ランキングあり🏆</div>
      </button>
      <button class="mode-card" onclick="authorSelect()">
        <div class="t"><span class="emoji">👤</span>作者モード</div>
        <div class="d">1人の作者にしぼって出題。全作品モード＆タイムアタック。</div>
      </button>
    </div>
    <div style="margin-top:20px">
      <div class="tabs">
        <button id="tab-ta" class="active" onclick="showBoard('timeattack')">⏱️ タイムアタック</button>
        <button id="tab-acc" onclick="showBoard('accuracy')">🎯 正答率</button>
      </div>
      <div id="board"><div class="loading">ランキング読み込み中…</div></div>
    </div>`;
  showBoard('timeattack');
}

// ===== 出題共通 =====
function nextQuestion(){
  S.answered=false;
  const pool = S.pool && S.pool.length ? S.pool : S.works;
  // 全作品モードは各作品を1回ずつ（順番はシャッフル済みの queue から取る）
  let target;
  if(S.queue && S.queue.length){ target = S.queue.shift(); }
  else { target = pick(pool,1)[0]; }
  S.cur=target;
  S.frameIdx=Math.floor(Math.random()*target.frames.length);
  const distract=pick(pool.filter(w=>w.id!==target.id),3);
  S.options=pick([target,...distract],4);
  renderQuestion();
}

function renderQuestion(){
  const w=S.cur, frame=w.frames[S.frameIdx];
  const authorMode = S.mode && S.mode.startsWith('author');
  const opts=S.options.map(o=>{
    // 作者モードは全員同じ作者なので、作品名＋投稿日で見分ける
    const info = authorMode
      ? `<div class="date">${o.date?esc(o.date):''}${o.duration?' ・ '+esc(o.duration):''}</div>`
      : `<div class="author">${esc(o.author)}</div>${o.date?'<div class="date">'+esc(o.date)+'</div>':''}`;
    return `<button class="choice" data-id="${o.id}" onclick="answer('${o.id}')">
      <div class="title">${esc(o.title)}</div>${info}
    </button>`;
  }).join('');
  app().innerHTML=`
    <div class="frame-box">
      <img src="frames/${frame}" alt="frame" onerror="this.style.opacity=.3">
      <div class="frame-tag">コマ ${S.frameIdx+1}/${w.frames.length}</div>
    </div>
    <div class="controls"><button class="btn-alt" onclick="otherFrame()">🔀 別のコマ！</button></div>
    <div class="hint">真っ黒/真っ白っぽいコマが出たら「別のコマ！」で変えられるよ</div>
    <div class="q">この1コマはどの作品？</div>
    <div class="choices">${opts}</div>
    <div class="result" id="result"></div>`;
  updateHud();
}

function otherFrame(){
  const w=S.cur; if(w.frames.length<2)return;
  let i=S.frameIdx; while(i===S.frameIdx)i=Math.floor(Math.random()*w.frames.length);
  S.frameIdx=i;
  const img=document.querySelector('.frame-box img'), tag=document.querySelector('.frame-tag');
  img.src='frames/'+w.frames[i]; img.style.opacity=1; tag.textContent=`コマ ${i+1}/${w.frames.length}`;
}

function answer(id){
  if(S.answered)return; S.answered=true;
  const w=S.cur, ok=id===w.id;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;
    if(b.dataset.id===w.id)b.classList.add('correct');
    else if(b.dataset.id===id)b.classList.add('wrong');});
  if(S.mode==='normal') afterNormal(ok,w);
  else afterTimed(ok,w);
}

function updateHud(){
  const timed = S.mode==='timeattack' || S.mode==='author_ta';
  if(S.mode==='normal'){
    hud().innerHTML=`連続 <b>${S.streak}</b> ／ 正解 <b>${S.correct}</b>/<b>${S.total}</b>`;
  }else if(timed){
    hud().innerHTML=`残り <span class="time">${S.timeLeft}</span>秒 ／ 正解 <b>${S.correct}</b>`;
  }else if(S.mode==='accuracy' || S.mode==='author_all'){
    const n=Math.min(S.total+1,S.limit);
    hud().innerHTML=`<b>${n}</b>/${S.limit}問 ／ 正解 <b>${S.correct}</b>`;
  }
}

function resetPool(){ S.pool=S.works; S.queue=null; S.author=null; }

// ===== ふつうモード =====
function startNormal(){resetPool();S.mode='normal';S.streak=0;S.correct=0;S.total=0;nextQuestion();}
function afterNormal(ok,w){
  S.total++; if(ok){S.correct++;S.streak++;}else S.streak=0;
  const r=document.getElementById('result'); r.className='result show';
  r.innerHTML=`
    <div>${ok?'✅ 正解！':'❌ 不正解…'} 答えは <b>${esc(w.title)}</b></div>
    <div class="meta" style="color:var(--muted);font-size:.85rem;margin-top:4px">${esc(w.author)}${w.date?' ・ '+esc(w.date):''} ・ ${esc(w.duration||'')}</div>
    <div style="margin-top:6px"><a href="${esc(w.url)}" target="_blank" rel="noopener">▶ 動画を見る</a> ・ <a href="https://aiueo9999.pythonanywhere.com/detail/${w.id}" target="_blank" rel="noopener">作品ページ</a></div>
    <button class="next" onclick="nextQuestion()">次の問題 →</button>`;
  updateHud();
}

// ===== タイムアタック / 正答率（回答したら即次へ） =====
function startTimer(){ S.timer=setInterval(()=>{S.timeLeft--;updateHud();if(S.timeLeft<=0)finishTimed();},1000); }
function startTA(){
  resetPool();
  S.mode='timeattack';S.correct=0;S.total=0;S.timeLeft=TA_SECONDS;
  startTimer(); nextQuestion();
}
function startACC(){
  resetPool();
  S.mode='accuracy';S.correct=0;S.total=0;S.limit=ACC_TOTAL;S.startTime=Date.now();
  nextQuestion();
}
function afterTimed(ok,w){
  S.total++; if(ok)S.correct++;
  updateHud();
  // 一瞬だけ結果を見せて自動で次へ
  const r=document.getElementById('result'); r.className='result show';
  r.innerHTML=`<div>${ok?'✅ 正解！':'❌ 不正解… 答えは <b>'+esc(w.title)+'</b>'}</div>`;
  const delay = ok?450:900;
  const fixed = (S.mode==='accuracy' || S.mode==='author_all');
  if(fixed && S.total>=S.limit){ setTimeout(finishTimed,delay); return; }
  setTimeout(()=>{ if(S.mode)nextQuestion(); }, delay);
}

function finishTimed(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  const mode=S.mode, author=S.author;
  let score, detail, label, big;
  if(mode==='timeattack'){ score=S.correct; detail=S.total; big=score; label=`${TA_SECONDS}秒で <b>${score}</b> 問正解`; }
  else if(mode==='accuracy'){ const sec=Math.round((Date.now()-S.startTime)/1000); score=S.correct; detail=sec; big=`${score}/${ACC_TOTAL}`; label=`${ACC_TOTAL}問中 <b>${score}</b> 問正解（${sec}秒）`; }
  else if(mode==='author_ta'){ score=S.correct; detail=S.total; big=score; label=`${esc(author)} で ${TA_SECONDS}秒 <b>${score}</b> 問正解`; }
  else { const sec=Math.round((Date.now()-S.startTime)/1000); score=S.correct; detail=sec; big=`${score}/${S.limit}`; label=`${esc(author)} 全${S.limit}問中 <b>${score}</b> 問正解（${sec}秒）`; }
  S.mode=null; hud().textContent='';

  // 作者モードはローカル結果のみ（共有ランキングなし）
  if(mode==='author_all' || mode==='author_ta'){
    S.selAuthor=author;
    app().innerHTML=`
      <div class="final"><div class="big">${big}</div><div class="sub">${label}</div></div>
      <button class="next" onclick="authorMenu()">同じ作者でもう一度</button>
      <button class="mode-card" style="margin-top:10px" onclick="home()">ホームへ戻る</button>`;
    return;
  }

  const lastName = localStorage.getItem('kwzq_name')||'';
  app().innerHTML=`
    <div class="final">
      <div class="big">${big}</div>
      <div class="sub">${label}</div>
    </div>
    <div class="name-row">
      <input id="pname" maxlength="16" placeholder="名前（16文字まで）" value="${esc(lastName)}">
      <button onclick="submitScore('${mode}',${score},${detail})">🏆 登録</button>
    </div>
    <div id="submsg" style="color:var(--muted);font-size:.85rem;text-align:center"></div>
    <button class="next" onclick="home()">ホームへ戻る</button>
    <div style="margin-top:18px"><div class="q">🏆 ランキング</div><div id="board"></div></div>`;
  renderBoard(mode, app().querySelector('#board'));
}

// ===== 作者モード =====
function authorList(){
  const from={};
  S.works.forEach(w=>{(from[w.author]=from[w.author]||[]).push(w);});
  return Object.entries(from).filter(([a,ws])=>ws.length>=4)
    .map(([a,ws])=>({author:a,count:ws.length}))
    .sort((x,y)=>y.count-x.count);
}
function authorSelect(){
  S.mode=null; hud().textContent='';
  const list=authorList();
  app().innerHTML=`
    <button class="back" onclick="home()">← ホーム</button>
    <div class="q">作者を選ぶ（4作品以上・${list.length}人）</div>
    <input class="search" id="asearch" placeholder="作者名で検索…" oninput="filterAuthors()">
    <div class="author-list" id="alist"></div>`;
  S._authors=list; renderAuthors(list);
  document.getElementById('asearch').focus();
}
function renderAuthors(list){
  const el=document.getElementById('alist');
  if(!list.length){el.innerHTML='<div class="loading">見つかりません</div>';return;}
  el.innerHTML=list.map((a,i)=>`
    <button class="author-item" onclick="authorMenuIdx(${i})">
      <span>${esc(a.author)}</span><span class="n">${a.count}作品</span>
    </button>`).join('');
  S._shown=list;
}
function filterAuthors(){
  const q=document.getElementById('asearch').value.trim().toLowerCase();
  renderAuthors(S._authors.filter(a=>a.author.toLowerCase().includes(q)));
}
function authorMenuIdx(i){ authorMenu(S._shown[i].author); }
function authorMenu(author){
  if(author) S.selAuthor=author; else author=S.selAuthor;
  S.mode=null; hud().textContent='';
  const pool=S.works.filter(w=>w.author===author);
  app().innerHTML=`
    <button class="back" onclick="authorSelect()">← 作者選択</button>
    <div class="final" style="padding:10px 0"><div style="font-size:1.4rem;font-weight:800">👤 ${esc(author)}</div><div class="sub">${pool.length}作品</div></div>
    <div class="modes">
      <button class="mode-card" onclick="startAuthorAll()">
        <div class="t"><span class="emoji">📚</span>全作品モード（${pool.length}問）</div>
        <div class="d">この作者の全${pool.length}作品を1問ずつ出題。</div>
      </button>
      <button class="mode-card" onclick="startAuthorTA()">
        <div class="t"><span class="emoji">⏱️</span>タイムアタック（${TA_SECONDS}秒）</div>
        <div class="d">この作者の作品から、制限時間内に何問正解できるか。</div>
      </button>
    </div>`;
}
function startAuthorAll(){
  const author=S.selAuthor;
  S.pool=S.works.filter(w=>w.author===author);
  S.queue=pick(S.pool, S.pool.length); // シャッフルして1回ずつ
  S.mode='author_all';S.author=author;S.correct=0;S.total=0;S.limit=S.pool.length;S.startTime=Date.now();
  nextQuestion();
}
function startAuthorTA(){
  const author=S.selAuthor;
  S.pool=S.works.filter(w=>w.author===author);
  S.queue=null;
  S.mode='author_ta';S.author=author;S.correct=0;S.total=0;S.timeLeft=TA_SECONDS;
  startTimer(); nextQuestion();
}

async function submitScore(mode,score,detail){
  const name=(document.getElementById('pname').value||'').trim().slice(0,16)||'名無し';
  localStorage.setItem('kwzq_name',name);
  const msg=document.getElementById('submsg'); msg.textContent='登録中…';
  try{
    await fetch(SB_URL+'/rest/v1/scores',{method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({mode,name,score,detail})});
    localStorage.setItem('kwzq_lastid', mode+'|'+name+'|'+score+'|'+detail);
    msg.textContent='✅ 登録しました！';
    renderBoard(mode, app().querySelector('#board'));
  }catch(e){ msg.textContent='❌ 登録に失敗しました（通信エラー）'; }
}

// ===== ランキング表示 =====
function showBoard(mode){
  document.getElementById('tab-ta').classList.toggle('active',mode==='timeattack');
  document.getElementById('tab-acc').classList.toggle('active',mode==='accuracy');
  renderBoard(mode, document.getElementById('board'));
}

async function renderBoard(mode, el){
  if(!el)return;
  el.innerHTML='<div class="loading">読み込み中…</div>';
  // timeattack: score降順。accuracy: score降順→detail(秒)昇順
  const order = mode==='timeattack' ? 'score.desc,created_at.asc' : 'score.desc,detail.asc';
  const url=SB_URL+`/rest/v1/scores?mode=eq.${mode}&order=${order}&limit=20&select=name,score,detail`;
  try{
    const rows=await (await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})).json();
    if(!rows.length){el.innerHTML='<div class="loading">まだ記録がありません。1位を狙おう！</div>';return;}
    const mine=localStorage.getItem('kwzq_lastid');
    const head = mode==='timeattack'
      ? '<tr><th>#</th><th>名前</th><th style="text-align:right">正解数</th></tr>'
      : '<tr><th>#</th><th>名前</th><th style="text-align:right">正解/秒</th></tr>';
    const body=rows.map((r,i)=>{
      const key=mode+'|'+r.name+'|'+r.score+'|'+r.detail;
      const me = key===mine ? ' class="me"' : '';
      const sc = mode==='timeattack' ? `${r.score}問` : `${r.score}/${ACC_TOTAL}・${Math.round(r.detail)}秒`;
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return `<tr${me}><td class="r">${medal}</td><td>${esc(r.name)}</td><td class="sc">${sc}</td></tr>`;
    }).join('');
    el.innerHTML=`<table class="rank">${head}${body}</table>`;
  }catch(e){ el.innerHTML='<div class="loading">ランキングを読み込めませんでした</div>'; }
}

// グローバル公開
Object.assign(window,{home,startNormal,startTA,startACC,answer,otherFrame,nextQuestion,submitScore,showBoard,
  authorSelect,filterAuthors,authorMenu,authorMenuIdx,startAuthorAll,startAuthorTA});
load();
</script>
